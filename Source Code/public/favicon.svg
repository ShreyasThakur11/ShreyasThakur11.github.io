<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d1d1f" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
  </defs>
  <!-- Classy dark rounded rectangle base -->
  <rect width="100" height="100" rx="20" fill="url(#grad)" />
  
  <!-- Very large, readable, premium serif 'S' from name 'Shreyas' -->
  <text x="50%" y="56%" font-family="Georgia, 'Playfair Display', serif" font-weight="900" font-style="italic" font-size="80" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">S</text>
</svg>
